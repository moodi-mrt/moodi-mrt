<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" role="img" aria-label="Current focus areas and their status.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <style>
      .mono{font-family:'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace}
      .lbl{fill:#E8EDF1;font-size:15px}
      .st{font-size:11px;letter-spacing:1.5px}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="519" height="299" rx="14" fill="url(#pbg)" stroke="#1B2732"/>

  <!-- header -->
  <text x="28" y="44" class="mono" font-size="12" letter-spacing="4" fill="#8B98A5">FOCUS</text>
  <text x="492" y="44" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#4E5D6A">2026</text>
  <line x1="28" y1="60" x2="492" y2="60" stroke="#1B2732"/>

  <g>
    <g transform="translate(0,102)">
      <text x="28" class="lbl">Java&#160;&amp;&#160;Spring&#160;backend</text>
      <rect x="404" y="-15" width="88" height="22" rx="11" fill="#0E2A17"/>
      <circle cx="420" cy="-4" r="3.5" fill="#22C55E"/>
      <text x="432" class="st mono" fill="#4ADE80">ACTIVE</text>
    </g>
    <g transform="translate(0,146)">
      <text x="28" class="lbl">DevOps&#160;&amp;&#160;CI/CD</text>
      <rect x="404" y="-15" width="88" height="22" rx="11" fill="#0E2A17"/>
      <circle cx="420" cy="-4" r="3.5" fill="#22C55E"/>
      <text x="432" class="st mono" fill="#4ADE80">ACTIVE</text>
    </g>
    <g transform="translate(0,190)">
      <text x="28" class="lbl">System&#160;design</text>
      <rect x="392" y="-15" width="100" height="22" rx="11" fill="#1E1533"/>
      <circle cx="408" cy="-4" r="3.5" fill="#7C3AED"/>
      <text x="420" class="st mono" fill="#A78BFA">BUILDING</text>
    </g>
    <g transform="translate(0,234)">
      <text x="28" class="lbl">Kubernetes</text>
      <rect x="392" y="-15" width="100" height="22" rx="11" fill="#0A2730"/>
      <circle cx="408" cy="-4" r="3.5" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
