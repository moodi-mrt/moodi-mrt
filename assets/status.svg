    </g>
  </g>

  <line x1="28" y1="262" x2="492" y2="262" stroke="#1B2732"/>
  <text x="28" y="284" class="mono" font-size="10.5" letter-spacing="1" fill="#4E5D6A">Software Engineering &#183; FAST-NUCES Peshawar</text>
</svg>
