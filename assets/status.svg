<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" role="img" aria-label="System status panel showing engineering focus areas and their current state.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#0B1118"/>
    </linearGradient>
    <style>
      .mono{font-family:'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace}
      .lbl{fill:#F2F5F7;font-size:14px;letter-spacing:0.5px}
      .st{font-size:12px;letter-spacing:1.5px}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="519" height="299" rx="14" fill="url(#pbg)" stroke="#1B2732"/>

  <!-- title bar -->
  <g class="mono">
    <circle cx="24" cy="30" r="4.5" fill="#FF5F57"/>
    <circle cx="42" cy="30" r="4.5" fill="#FEBC2E"/>
    <circle cx="60" cy="30" r="4.5" fill="#28C840"/>
    <text x="500" y="34" text-anchor="end" font-size="11" letter-spacing="2" fill="#5C6B78">~/mehmood/system.status</text>
  </g>
  <line x1="16" y1="50" x2="504" y2="50" stroke="#1B2732"/>

  <text x="24" y="76" class="mono" font-size="11" letter-spacing="3" fill="#8B98A5">SYSTEM STATUS</text>

  <g class="mono">
    <!-- rows -->
    <g transform="translate(0,100)">
      <text x="24" class="lbl mono">JAVA BACKEND</text>
      <circle cx="404" cy="-4" r="4.5" fill="#22C55E"/>
      <text x="418" class="st mono" fill="#22C55E">ACTIVE</text>
    </g>
    <g transform="translate(0,136)">
      <text x="24" class="lbl mono">DEVOPS &amp; CI/CD</text>
      <circle cx="404" cy="-4" r="4.5" fill="#22C55E"/>
      <text x="418" class="st mono" fill="#22C55E">ACTIVE</text>
    </g>
    <g transform="translate(0,172)">
      <text x="24" class="lbl mono">KUBERNETES</text>
      <circle cx="404" cy="-4" r="4.5" fill="#00E5FF">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="418" class="st mono" fill="#00E5FF">LEARNING</text>
    </g>
    <g transform="translate(0,208)">
      <text x="24" class="lbl mono">SYSTEM DESIGN</text>
      <circle cx="404" cy="-4" r="4.5" fill="#7C3AED"/>
      <text x="418" class="st mono" fill="#9B6BF0">BUILDING</text>
    </g>
    <g transform="translate(0,244)">
      <text x="24" class="lbl mono">OPEN SOURCE</text>
      <circle cx="404" cy="-4" r="4.5" fill="#8B98A5"/>
      <text x="418" class="st mono" fill="#8B98A5">EXPLORING</text>
    </g>
  </g>

  <line x1="16" y1="266" x2="504" y2="266" stroke="#1B2732"/>
  <text x="24" y="286" class="mono" font-size="10.5" letter-spacing="1.5" fill="#5C6B78">uptime: since 2024 &#183; region: peshawar &#183; role: student-engineer</text>
</svg>
