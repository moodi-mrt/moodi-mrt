<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Mehmood — Java Backend &amp; DevOps Engineer. Building secure, reliable and scalable systems.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:'SFMono-Regular',ui-monospace,'JetBrains Mono',Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#15202B"/>

  <!-- eyebrow -->
  <text x="64" y="92" class="mono" font-size="13" letter-spacing="6" fill="#8B98A5">SOFTWARE&#160;ENGINEER</text>

  <!-- name -->
  <text x="61" y="176" class="sans" font-size="86" font-weight="700" letter-spacing="1" fill="#F2F5F7">Mehmood</text>

  <!-- accent hairline under name -->
  <rect x="64" y="200" width="300" height="2" fill="url(#rule)"/>

  <!-- role -->
  <text x="64" y="236" class="sans" font-size="21" font-weight="500" fill="#C6D1DA">Java&#160;Backend&#160;&amp;&#160;DevOps&#160;Engineer</text>

  <!-- tagline -->
  <text x="64" y="266" class="sans" font-size="15" fill="#8B98A5">Building secure, reliable and scalable systems &#8212; the services, queues and pipelines beneath the surface.</text>

  <!-- right meta column -->
  <g class="mono" font-size="12.5" letter-spacing="1" fill="#5C6B78" text-anchor="end">
    <text x="936" y="88">FAST-NUCES</text>
    <text x="936" y="108">Peshawar, PK &#183; UTC+5</text>
  </g>
  <g>
    <circle cx="692" cy="258" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="706" y="262" class="mono" font-size="12.5" letter-spacing="1" fill="#8B98A5">Available for internships</text>
  </g>
</svg>
